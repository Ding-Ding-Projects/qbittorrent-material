name: Build and release every push

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# One run creates one immutable, full release for the commit that triggered it.
# Branch filtering excludes tag pushes, so the release tag cannot start a loop.
permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static-md

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Measure hosted runner resources
        shell: pwsh
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $logicalProcessors = [int] $computer.NumberOfLogicalProcessors
          $memoryGiB = [Math]::Round($computer.TotalPhysicalMemory / 1GB, 2)
          $freeMemoryGiB = [Math]::Round($operatingSystem.FreePhysicalMemory * 1KB / 1GB, 2)

          Write-Host "Runner image: $env:ImageOS"
          Write-Host "Logical processors: $logicalProcessors"
          Write-Host "Physical memory: $memoryGiB GiB ($freeMemoryGiB GiB free)"

          if ($logicalProcessors -lt 2 -or $freeMemoryGiB -lt 2) {
            throw "The hosted runner is below the measured CPU or memory minimum."
          }

          $buildRoots = @(
            [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE),
            [IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique
          $reportedRoots = @($env:SystemDrive) + $buildRoots | Sort-Object -Unique
          foreach ($root in $reportedRoots) {
            $deviceId = $root.TrimEnd('\')
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$deviceId'"
            if ($null -eq $disk) {
              throw "Could not measure runner volume $root."
            }
            $diskGiB = [Math]::Round($disk.Size / 1GB, 2)
            $freeDiskGiB = [Math]::Round($disk.FreeSpace / 1GB, 2)
            Write-Host "Volume ${root}: $diskGiB GiB ($freeDiskGiB GiB free)"
            if ($buildRoots -contains $root -and $freeDiskGiB -lt 12) {
              throw "Build volume $root has less than 12 GiB free."
            }
          }

      - name: Prepare an immutable monotonic release identity
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $buildId = "build.$env:GITHUB_RUN_NUMBER.$shortSha"
          $projectDeclaration = Get-Content -Raw -LiteralPath CMakeLists.txt
          if ($projectDeclaration -notmatch '(?s)project\(qbittorrent-material\s+VERSION\s+([0-9]+)\.([0-9]+)\.[0-9]+') {
            throw "Could not derive the Squirrel package version from project()."
          }
          $packageVersion = "$($Matches[1]).$($Matches[2]).$env:GITHUB_RUN_NUMBER"
          $tag = if ($env:GITHUB_REF_NAME -eq 'master') {
            "v$packageVersion"
          }
          else {
            "build-$env:GITHUB_RUN_NUMBER-$shortSha"
          }
          $title = if ($env:GITHUB_REF_NAME -eq 'master') {
            "qBittorrent Material $packageVersion ($shortSha)"
          }
          else {
            "qBittorrent Material preview #$env:GITHUB_RUN_NUMBER ($shortSha)"
          }

          $tagRefs = @(& git ls-remote --tags origin "refs/tags/$tag")
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -ne 0) {
            throw "Could not prove release-tag availability (git exit $tagLookupExitCode)."
          }
          if ($tagRefs.Count -ne 0) {
            throw "Immutable release tag already exists: $tag"
          }

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -ne 0) {
            throw "Could not list releases (gh exit $releaseLookupExitCode)."
          }
          $releaseMatches = @(($releaseJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag })
          if ($releaseMatches.Count -ne 0) {
            throw "Immutable release already exists: $tag"
          }

          $immutablePolicyJson = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/immutable-releases"
          $immutablePolicyExitCode = $LASTEXITCODE
          if ($immutablePolicyExitCode -ne 0) {
            throw "Could not verify repository release immutability (gh exit $immutablePolicyExitCode)."
          }
          $immutablePolicy = $immutablePolicyJson | ConvertFrom-Json
          if (-not $immutablePolicy.enabled) {
            throw "Repository release immutability must be enabled before building."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "packageVersion=$packageVersion" >> $env:GITHUB_OUTPUT
          "QBT_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "QBT_PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          Write-Host "Reserved release identity $tag and Squirrel package $packageVersion for $env:GITHUB_SHA."

      - name: Download the previous Squirrel feed when available
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $previousRoot = Join-Path $env:RUNNER_TEMP "qbt-material-previous-squirrel"
          New-Item -ItemType Directory -Force -Path $previousRoot | Out-Null

          # `gh release view` alone does not distinguish an expected first
          # release from authentication, transport, and API failures. Probe the
          # REST endpoint with response headers and permit only a proven 404.
          $latestProbe = @(
            & gh api --include `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2026-03-10" `
              "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>&1 |
              ForEach-Object { $_.ToString() }
          )
          $latestProbeExitCode = $LASTEXITCODE
          $statusLine = @(
            $latestProbe |
              Where-Object { $_ -match '^HTTP/\S+\s+[0-9]{3}\b' } |
              Select-Object -Last 1
          )
          if ($statusLine.Count -ne 1 `
              -or $statusLine[0] -notmatch '^HTTP/\S+\s+(?<status>[0-9]{3})\b') {
            throw "Could not determine the HTTP status of the latest-release probe."
          }
          $latestStatus = [int]$Matches.status
          if ($latestStatus -eq 404) {
            Write-Host "GitHub proved that no latest release is available; this is the first feed migration."
            "directory=" >> $env:GITHUB_OUTPUT
            "hasFeed=false" >> $env:GITHUB_OUTPUT
            "packageVersion=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($latestProbeExitCode -ne 0 -or $latestStatus -lt 200 -or $latestStatus -ge 300) {
            throw "Latest-release discovery failed closed (HTTP $latestStatus, gh exit $latestProbeExitCode)."
          }

          $latestJson = gh release view --repo $env:GITHUB_REPOSITORY `
            --json tagName,assets
          if ($LASTEXITCODE -ne 0) {
            throw "The latest release was proven present but could not be read."
          }
          $latest = $latestJson | ConvertFrom-Json
          $assetNames = @($latest.assets | ForEach-Object { $_.name })
          $manifestName = @($assetNames | Where-Object { $_ -eq "RELEASES" })
          $fullPackageNames = @($assetNames | Where-Object {
            $_ -match '^qBittorrentMaterial-[0-9]+\.[0-9]+\.[0-9]+-full\.nupkg$'
          })
          $installerNames = @($assetNames | Where-Object {
            $_ -match '^qBittorrent-Material-[0-9]+\.[0-9]+\.[0-9]+-windows-x64-Setup\.exe$'
          })
          if ($manifestName.Count -eq 0 -and $fullPackageNames.Count -eq 0) {
            Write-Host "Latest release $($latest.tagName) predates the Squirrel feed; delta/upgrade smoke is not applicable."
            "directory=" >> $env:GITHUB_OUTPUT
            "hasFeed=false" >> $env:GITHUB_OUTPUT
            "packageVersion=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($manifestName.Count -ne 1 -or $fullPackageNames.Count -ne 1) {
            throw "Latest release $($latest.tagName) has a partial or ambiguous Squirrel feed."
          }
          if ($installerNames.Count -ne 1) {
            throw "Latest Squirrel feed $($latest.tagName) must carry exactly one matching Setup installer."
          }

          $fullMatch = [regex]::Match(
            $fullPackageNames[0],
            '^qBittorrentMaterial-(?<version>[0-9]+\.[0-9]+\.[0-9]+)-full\.nupkg$')
          $installerMatch = [regex]::Match(
            $installerNames[0],
            '^qBittorrent-Material-(?<version>[0-9]+\.[0-9]+\.[0-9]+)-windows-x64-Setup\.exe$')
          if (-not $fullMatch.Success -or -not $installerMatch.Success `
              -or $fullMatch.Groups['version'].Value -ne $installerMatch.Groups['version'].Value) {
            throw "Latest Squirrel feed $($latest.tagName) has mismatched full-package and Setup versions."
          }
          $previousVersion = $fullMatch.Groups['version'].Value

          # The prior manifest and full package are sufficient to generate a
          # current delta. Never download or execute the historical Setup.exe
          # from a token-bearing release job.
          foreach ($assetName in @($manifestName[0], $fullPackageNames[0])) {
            gh release download $latest.tagName --repo $env:GITHUB_REPOSITORY `
              --pattern $assetName --dir $previousRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download prior Squirrel asset $assetName."
            }
          }
          $previousManifest = Join-Path $previousRoot $manifestName[0]
          $previousFullPackage = Join-Path $previousRoot $fullPackageNames[0]
          foreach ($requiredPreviousAsset in @(
            $previousManifest,
            $previousFullPackage
          )) {
            if (-not (Test-Path -LiteralPath $requiredPreviousAsset -PathType Leaf) `
                -or (Get-Item -LiteralPath $requiredPreviousAsset).Length -le 0) {
              throw "Downloaded prior Squirrel asset is missing or empty: $requiredPreviousAsset"
            }
          }
          if (-not (Get-Content -Raw -LiteralPath $previousManifest).Contains(
              "qBittorrentMaterial-$previousVersion-full.nupkg")) {
            throw "Prior RELEASES does not reference the required full package for $previousVersion."
          }

          "directory=$previousRoot" >> $env:GITHUB_OUTPUT
          "hasFeed=true" >> $env:GITHUB_OUTPUT
          "packageVersion=$previousVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Recovered prior Squirrel feed metadata and full package $previousVersion from $($latest.tagName) without executing its installer."

      - name: Count project lines for the release record
        id: lines
        shell: pwsh
        run: |
          $lineCountPath = Join-Path $env:RUNNER_TEMP "project-line-count.md"
          & ./scripts/count-lines.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE |
            Set-Content -LiteralPath $lineCountPath -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) {
            throw "The committed project line counter failed."
          }
          "path=$lineCountPath" >> $env:GITHUB_OUTPUT
          Get-Content -LiteralPath $lineCountPath

      - name: Select verified dim-sum release photo and code name
        id: dimsum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # The selector resolves only the authoritative public catalog and its
          # published catalog-v1* assets. Unavailability is a version-only
          # result, not a release failure and never triggers a local download.
          & ./scripts/select-release-dim-sum.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputPath $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            throw "The verified dim-sum release selection failed."
          }

      - name: Stamp the selected public release identity into the desktop build
        shell: pwsh
        env:
          DIM_SUM_AVAILABLE: ${{ steps.dimsum.outputs.available }}
          DIM_SUM_ID: ${{ steps.dimsum.outputs.id }}
          DIM_SUM_CODE_NAME: ${{ steps.dimsum.outputs.codeName }}
          DIM_SUM_ENGLISH: ${{ steps.dimsum.outputs.english }}
          DIM_SUM_ZH_HANT: ${{ steps.dimsum.outputs.zhHant }}
          DIM_SUM_PHOTO_URL: ${{ steps.dimsum.outputs.photoUrl }}
          DIM_SUM_PHOTO_ASSET_NAME: ${{ steps.dimsum.outputs.photoAssetName }}
          DIM_SUM_PHOTO_DIGEST: ${{ steps.dimsum.outputs.photoDigest }}
          DIM_SUM_PHOTO_TAG: ${{ steps.dimsum.outputs.photoTag }}
          DIM_SUM_CATALOG_SOURCE_URL: ${{ steps.dimsum.outputs.catalogSourceUrl }}
          DIM_SUM_CATALOG_REVISION: ${{ steps.dimsum.outputs.catalogRevision }}
          DIM_SUM_CATALOG_BLOB_SHA: ${{ steps.dimsum.outputs.catalogBlobSha }}
          DIM_SUM_REASON: ${{ steps.dimsum.outputs.reason }}
        run: |
          if ($env:DIM_SUM_AVAILABLE -notin @('true', 'false')) {
            throw "Dim-sum release availability output is missing or invalid."
          }
          $identity = [ordered]@{
            schemaVersion = 1
            available = $env:DIM_SUM_AVAILABLE -eq 'true'
            id = $env:DIM_SUM_ID
            codeName = $env:DIM_SUM_CODE_NAME
            english = $env:DIM_SUM_ENGLISH
            zhHant = $env:DIM_SUM_ZH_HANT
            photoUrl = $env:DIM_SUM_PHOTO_URL
            photoAssetName = $env:DIM_SUM_PHOTO_ASSET_NAME
            photoDigest = $env:DIM_SUM_PHOTO_DIGEST
            photoTag = $env:DIM_SUM_PHOTO_TAG
            catalogSourceUrl = $env:DIM_SUM_CATALOG_SOURCE_URL
            catalogRevision = $env:DIM_SUM_CATALOG_REVISION
            catalogBlobSha = $env:DIM_SUM_CATALOG_BLOB_SHA
            reason = $env:DIM_SUM_REASON
          }
          $escapedPhotoTag = [regex]::Escape([string]$identity.photoTag)
          $escapedPhotoAssetName = [regex]::Escape([string]$identity.photoAssetName)
          if ($identity.available `
              -and ([string]::IsNullOrWhiteSpace($identity.id) `
                -or $identity.codeName -cne "$($identity.english) · $($identity.zhHant)" `
                -or $identity.photoAssetName -notmatch '^hk-dish-[0-9]{4}-[a-z0-9-]+\.png$' `
                -or $identity.photoTag -notmatch '^catalog-v1(?:-part-[0-9]{3})?$' `
                -or $identity.photoUrl -notmatch "^https://github\.com/Ding-Ding-Projects/dim-sum-photos/releases/download/$escapedPhotoTag/$escapedPhotoAssetName$" `
                -or $identity.photoDigest -notmatch '^sha256:[0-9a-f]{64}$' `
                -or $identity.catalogRevision -notmatch '^[0-9a-f]{40}$' `
                -or $identity.catalogBlobSha -notmatch '^[0-9a-f]{40}$')) {
            throw "Available dim-sum identity is not a complete authoritative published catalog-v1 record."
          }
          $identityPath = Join-Path $env:GITHUB_WORKSPACE `
            'resources/experience/release-identity.json'
          $identity | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath $identityPath -Encoding utf8NoBOM
          $verifiedIdentity = Get-Content -Raw -LiteralPath $identityPath | ConvertFrom-Json
          if ([bool]$verifiedIdentity.available -ne $identity.available `
              -or [string]$verifiedIdentity.catalogRevision -ne $identity.catalogRevision `
              -or [string]$verifiedIdentity.photoUrl -ne $identity.photoUrl) {
            throw "The build-specific release identity did not round-trip exactly."
          }

      - name: Run desktop policy and content-integrity tests
        shell: pwsh
        run: ./scripts/test-desktop-policy.ps1 -SkipRuntimeStartup

      - name: Activate the MSVC 2022 toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # The install-qt wrapper action delegates through mutable @v6/@v4 tags.
      # Invoke its internal action directly after pinning Python ourselves so
      # every downloaded action in this write-capable release job is immutable.
      - name: Set up Python for the Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qt5compat qtimageformats qtshadertools qtmultimedia"
          cache: true

      - name: Set up vcpkg and binary caching
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: "**/vcpkg.json"
          runVcpkgInstall: false

      - name: Configure the release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DQBT_BUILD_ID=$env:QBT_BUILD_ID" `
            "-DQBT_PACKAGE_VERSION=$env:QBT_PACKAGE_VERSION"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Install runtime for QML startup smoke test
        shell: pwsh
        run: |
          $qmlSmokeRoot = Join-Path $env:RUNNER_TEMP "qbt-material-qml-startup"
          if (Test-Path -LiteralPath $qmlSmokeRoot) {
            Remove-Item -Recurse -Force -LiteralPath $qmlSmokeRoot
          }
          cmake --install build --prefix $qmlSmokeRoot
          if ($LASTEXITCODE -ne 0) {
            throw "The QML startup install tree could not be created."
          }
          $qmlSmokeExe = Join-Path $qmlSmokeRoot "bin/qbittorrent.exe"
          $qmlSmokePlugin = Join-Path $qmlSmokeRoot "plugins/platforms/qoffscreen.dll"
          if (-not (Test-Path -LiteralPath $qmlSmokeExe) -or
              -not (Test-Path -LiteralPath $qmlSmokePlugin)) {
            throw "The QML startup install tree is missing the executable or qoffscreen.dll."
          }
          "QBT_QML_SMOKE_ROOT=$qmlSmokeRoot" >> $env:GITHUB_ENV

      - name: Run built QML startup smoke test
        shell: pwsh
        run: |
          $qmlSmokeExe = Join-Path $env:QBT_QML_SMOKE_ROOT "bin/qbittorrent.exe"
          $qmlSmokePlugin = Join-Path $env:QBT_QML_SMOKE_ROOT "plugins/platforms/qoffscreen.dll"
          ./scripts/test-qml-startup.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -BinaryPath $qmlSmokeExe `
            -PlatformPluginPath $qmlSmokePlugin `
            -TimeoutSeconds 60

      - name: Build and verify the Squirrel installer and update feed
        id: package
        shell: pwsh
        env:
          PREVIOUS_RELEASE_DIRECTORY: ${{ steps.previous.outputs.directory }}
          PREVIOUS_FEED_AVAILABLE: ${{ steps.previous.outputs.hasFeed }}
          SQUIRREL_SIGN_WITH_PARAMS: ${{ secrets.SQUIRREL_SIGN_WITH_PARAMS }}
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "build/squirrel-release"
          $packageArguments = @{
            PackageVersion = $env:QBT_PACKAGE_VERSION
            RepositoryRoot = $env:GITHUB_WORKSPACE
            BuildDirectory = "build"
            OutputDirectory = "build/squirrel-release"
            GitHubOutputPath = $env:GITHUB_OUTPUT
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_RELEASE_DIRECTORY)) {
            $packageArguments.PreviousReleaseDirectory = $env:PREVIOUS_RELEASE_DIRECTORY
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SQUIRREL_SIGN_WITH_PARAMS)) {
            # Squirrel 2.0.1 records raw releasify arguments in its local log.
            # This value may therefore contain only non-secret certificate-store
            # or HSM selectors; the packaging helper rejects password/PIN/token
            # flags rather than pretending Actions masking protects tool logs.
            $packageArguments.SignWithParams = $env:SQUIRREL_SIGN_WITH_PARAMS
          }
          & ./scripts/build-squirrel-package.ps1 @packageArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Squirrel package generation failed."
          }

          $installer = Join-Path $releaseDirectory "qBittorrent-Material-$env:QBT_PACKAGE_VERSION-windows-x64-Setup.exe"
          $smokeArguments = @{
            InstallerPath = $installer
            PackageVersion = $env:QBT_PACKAGE_VERSION
            ReleaseDirectory = $releaseDirectory
          }
          if ($env:PREVIOUS_FEED_AVAILABLE -notin @("true", "false")) {
            throw "Prior Squirrel feed availability is missing or invalid."
          }
          if ($env:PREVIOUS_FEED_AVAILABLE -eq "true" `
              -and [string]::IsNullOrWhiteSpace($env:PREVIOUS_RELEASE_DIRECTORY)) {
            throw "A validated prior Squirrel feed must provide its manifest and full package for delta generation."
          }
          $smokeArguments.ExpectDelta = ($env:PREVIOUS_FEED_AVAILABLE -eq "true")
          & ./scripts/test-squirrel-package.ps1 @smokeArguments
          if ($LASTEXITCODE -ne 0) {
            throw "The installed Squirrel application smoke test failed."
          }

      - name: Sign and verify the exact Squirrel feed manifest
        id: feed_signature
        shell: pwsh
        env:
          RELEASES_PATH: ${{ steps.package.outputs.releases }}
          SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publicKeyPath = Join-Path $env:GITHUB_WORKSPACE `
            'resources/updates/squirrel-feed-public-key.json'
          if (-not (Test-Path -LiteralPath $env:RELEASES_PATH -PathType Leaf)) {
            throw "The exact RELEASES manifest to sign is missing."
          }
          if (-not (Test-Path -LiteralPath $publicKeyPath -PathType Leaf)) {
            throw "The committed Squirrel feed public key is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64)) {
            throw "SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64 is required; unsigned feed publication is forbidden."
          }

          $keyRecord = Get-Content -Raw -LiteralPath $publicKeyPath | ConvertFrom-Json
          if ($keyRecord.schemaVersion -ne 1 `
              -or $keyRecord.algorithm -ne 'RSASSA-PKCS1-v1_5-SHA256' `
              -or [string]$keyRecord.spkiSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "The committed Squirrel feed public-key record has an unsupported schema or algorithm."
          }
          try {
            $publicDer = [Convert]::FromBase64String([string]$keyRecord.spkiDerBase64)
          }
          catch {
            throw "The committed Squirrel feed SPKI is not standard base64."
          }
          $calculatedFingerprint = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($publicDer)).ToLowerInvariant()
          if ($calculatedFingerprint -ne [string]$keyRecord.spkiSha256 `
              -or $calculatedFingerprint -ne '4479439dfb5bce538ab92e492dd677628060c8558d4c49ac7b253f3eeb4f36e8') {
            throw "The committed Squirrel feed SPKI fingerprint is invalid."
          }

          $privateDer = $null
          $privateRsa = $null
          $publicRsa = $null
          try {
            try {
              $privateDer = [Convert]::FromBase64String(
                $env:SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64)
              $env:SQUIRREL_FEED_SIGNING_PRIVATE_KEY_B64 = ''
            }
            catch {
              throw "The Squirrel feed signing key is not PKCS#8 DER encoded as standard base64."
            }
            $privateRsa = [Security.Cryptography.RSA]::Create()
            $privateBytesRead = 0
            $privateRsa.ImportPkcs8PrivateKey($privateDer, [ref]$privateBytesRead)
            if ($privateBytesRead -ne $privateDer.Length -or $privateRsa.KeySize -ne 3072) {
              throw "The feed signing key must be exactly one RSA-3072 PKCS#8 DER value."
            }

            $publicRsa = [Security.Cryptography.RSA]::Create()
            $publicBytesRead = 0
            $publicRsa.ImportSubjectPublicKeyInfo($publicDer, [ref]$publicBytesRead)
            if ($publicBytesRead -ne $publicDer.Length -or $publicRsa.KeySize -ne 3072) {
              throw "The committed feed verification key must be RSA-3072 SPKI DER."
            }
            $privatePublicDer = $privateRsa.ExportSubjectPublicKeyInfo()
            if ([Convert]::ToBase64String($privatePublicDer) `
                -ne [Convert]::ToBase64String($publicDer)) {
              throw "The secret feed signing key does not match the committed public key."
            }

            # Read once and write no normalized copy: these exact bytes are the
            # bytes uploaded as RELEASES and covered by the detached signature.
            $releaseBytes = [IO.File]::ReadAllBytes($env:RELEASES_PATH)
            if ($releaseBytes.Length -le 0) {
              throw "The exact RELEASES manifest is empty."
            }
            $signatureBytes = $privateRsa.SignData(
              $releaseBytes,
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.RSASignaturePadding]::Pkcs1)
            if ($signatureBytes.Length -ne ($privateRsa.KeySize / 8) `
                -or $signatureBytes.Length -gt 1024 `
                -or -not $publicRsa.VerifyData(
                  $releaseBytes,
                  $signatureBytes,
                  [Security.Cryptography.HashAlgorithmName]::SHA256,
                  [Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
              throw "The detached RELEASES signature failed local public-key verification."
            }
            $signaturePath = Join-Path `
              (Split-Path -Parent $env:RELEASES_PATH) 'RELEASES.sig'
            if (Test-Path -LiteralPath $signaturePath) {
              throw "Refusing to overwrite a stale RELEASES.sig."
            }
            [IO.File]::WriteAllBytes($signaturePath, $signatureBytes)
            $signatureSha256 = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($signatureBytes)).ToLowerInvariant()

            "path=$signaturePath" >> $env:GITHUB_OUTPUT
            "sha256=$signatureSha256" >> $env:GITHUB_OUTPUT
            "size=$($signatureBytes.Length)" >> $env:GITHUB_OUTPUT
            "algorithm=$($keyRecord.algorithm)" >> $env:GITHUB_OUTPUT
            "publicKeyFingerprint=$calculatedFingerprint" >> $env:GITHUB_OUTPUT
            Write-Host "Verified detached RELEASES signature with committed RSA-3072 public key $calculatedFingerprint."
          }
          finally {
            if ($null -ne $privateDer) {
              [Security.Cryptography.CryptographicOperations]::ZeroMemory($privateDer)
            }
            if ($null -ne $privateRsa) { $privateRsa.Dispose() }
            if ($null -ne $publicRsa) { $publicRsa.Dispose() }
          }

      - name: Publish one immutable non-draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.package.outputs.installer }}
          INSTALLER_SHA256: ${{ steps.package.outputs.installerSha256 }}
          RELEASES_PATH: ${{ steps.package.outputs.releases }}
          FULL_PACKAGE_PATH: ${{ steps.package.outputs.fullPackage }}
          FULL_PACKAGE_SHA256: ${{ steps.package.outputs.fullPackageSha256 }}
          DELTA_PACKAGE_PATH: ${{ steps.package.outputs.deltaPackage }}
          DELTA_PACKAGE_SHA256: ${{ steps.package.outputs.deltaPackageSha256 }}
          PACKAGE_VERSION: ${{ steps.package.outputs.packageVersion }}
          PACKAGE_SIGNED: ${{ steps.package.outputs.signed }}
          PREVIOUS_FEED_AVAILABLE: ${{ steps.previous.outputs.hasFeed }}
          FEED_SIGNATURE_PATH: ${{ steps.feed_signature.outputs.path }}
          FEED_SIGNATURE_SHA256: ${{ steps.feed_signature.outputs.sha256 }}
          FEED_SIGNATURE_SIZE: ${{ steps.feed_signature.outputs.size }}
          FEED_SIGNATURE_ALGORITHM: ${{ steps.feed_signature.outputs.algorithm }}
          FEED_PUBLIC_KEY_FINGERPRINT: ${{ steps.feed_signature.outputs.publicKeyFingerprint }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          DIM_SUM_AVAILABLE: ${{ steps.dimsum.outputs.available }}
          DIM_SUM_ID: ${{ steps.dimsum.outputs.id }}
          DIM_SUM_CODE_NAME: ${{ steps.dimsum.outputs.codeName }}
          DIM_SUM_ENGLISH: ${{ steps.dimsum.outputs.english }}
          DIM_SUM_ZH_HANT: ${{ steps.dimsum.outputs.zhHant }}
          DIM_SUM_PHOTO_URL: ${{ steps.dimsum.outputs.photoUrl }}
          DIM_SUM_PHOTO_ASSET_NAME: ${{ steps.dimsum.outputs.photoAssetName }}
          DIM_SUM_PHOTO_DIGEST: ${{ steps.dimsum.outputs.photoDigest }}
          DIM_SUM_PHOTO_TAG: ${{ steps.dimsum.outputs.photoTag }}
          DIM_SUM_CATALOG_SOURCE_URL: ${{ steps.dimsum.outputs.catalogSourceUrl }}
          DIM_SUM_CATALOG_REVISION: ${{ steps.dimsum.outputs.catalogRevision }}
          DIM_SUM_CATALOG_BLOB_SHA: ${{ steps.dimsum.outputs.catalogBlobSha }}
          DIM_SUM_REASON: ${{ steps.dimsum.outputs.reason }}
          LINE_COUNT_PATH: ${{ steps.lines.outputs.path }}
        run: |
          function Get-PublishedMasterSquirrelReleases {
            $inventoryJson = gh api --paginate --slurp `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2026-03-10" `
              "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate published releases for latest-channel arbitration."
            }
            $parsedInventory = ($inventoryJson -join [Environment]::NewLine) |
              ConvertFrom-Json
            $inventory = @($parsedInventory)
            $records = @(
              foreach ($candidate in $inventory) {
                if ($candidate.draft -or $candidate.prerelease) { continue }
                $body = [string]$candidate.body
                $packageMatch = [regex]::Match(
                  $body,
                  '(?m)^- Squirrel package: \x60(?<version>[0-9]+\.[0-9]+\.[0-9]+)\x60\s*$')
                $branchMatch = [regex]::Match(
                  $body,
                  '(?m)^- Branch: \x60(?<branch>[^\x60]+)\x60\s*$')
                if (-not $packageMatch.Success -or -not $branchMatch.Success `
                    -or $branchMatch.Groups['branch'].Value -ne 'master') {
                  continue
                }
                [pscustomobject]@{
                  TagName = [string]$candidate.tag_name
                  PackageVersion = [version]::Parse(
                    $packageMatch.Groups['version'].Value)
                  PackageVersionText = $packageMatch.Groups['version'].Value
                }
              }
            )
            $duplicateVersions = @(
              $records | Group-Object PackageVersionText |
                Where-Object { $_.Count -gt 1 }
            )
            if ($duplicateVersions.Count -ne 0) {
              throw "Published master-channel Squirrel versions are not unique: $($duplicateVersions.Name -join ', ')."
            }
            return $records
          }

          function Get-LocalReleaseAsset([string]$Path) {
            $item = Get-Item -LiteralPath $Path
            return [pscustomobject]@{
              Path = $item.FullName
              Name = $item.Name
              Size = [int64]$item.Length
              Sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            }
          }

          $releaseAssets = @(
            $env:INSTALLER_PATH,
            $env:RELEASES_PATH,
            $env:FEED_SIGNATURE_PATH,
            $env:FULL_PACKAGE_PATH
          )
          foreach ($requiredPath in $releaseAssets) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required release asset is missing: $requiredPath"
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:DELTA_PACKAGE_PATH)) {
            if (-not (Test-Path -LiteralPath $env:DELTA_PACKAGE_PATH -PathType Leaf)) {
              throw "Declared delta package is missing: $env:DELTA_PACKAGE_PATH"
            }
            $releaseAssets += $env:DELTA_PACKAGE_PATH
          }

          if ($env:PREVIOUS_FEED_AVAILABLE -notin @('true', 'false')) {
            throw "Prior-feed availability output is missing or invalid."
          }
          if ($env:PREVIOUS_FEED_AVAILABLE -eq 'true' `
              -and [string]::IsNullOrWhiteSpace($env:DELTA_PACKAGE_PATH)) {
            throw "A validated prior Squirrel feed requires a real current delta package."
          }
          if ($env:PREVIOUS_FEED_AVAILABLE -eq 'false' `
              -and -not [string]::IsNullOrWhiteSpace($env:DELTA_PACKAGE_PATH)) {
            throw "A first-feed build unexpectedly declared a delta package."
          }

          if ($env:PACKAGE_SIGNED -notin @('true', 'false')) {
            throw "Squirrel signing verification output is missing or invalid."
          }
          $authenticodeState = if ($env:PACKAGE_SIGNED -eq 'true') {
            "Verified Authenticode signing on the emitted Squirrel executables."
          }
          else {
            "Not applied; update authenticity is enforced by the mandatory detached RELEASES signature."
          }
          if ($env:FEED_SIGNATURE_ALGORITHM -ne 'RSASSA-PKCS1-v1_5-SHA256' `
              -or $env:FEED_PUBLIC_KEY_FINGERPRINT -ne '4479439dfb5bce538ab92e492dd677628060c8558d4c49ac7b253f3eeb4f36e8' `
              -or $env:FEED_SIGNATURE_SHA256 -notmatch '^[0-9a-f]{64}$' `
              -or $env:FEED_SIGNATURE_SIZE -notmatch '^[0-9]+$' `
              -or [int]$env:FEED_SIGNATURE_SIZE -le 0 `
              -or [int]$env:FEED_SIGNATURE_SIZE -gt 1024) {
            throw "Mandatory detached Squirrel feed-signature evidence is missing or invalid."
          }

          $localAssets = @($releaseAssets | ForEach-Object { Get-LocalReleaseAsset $_ })
          $localInstaller = @($localAssets | Where-Object { $_.Path -eq $env:INSTALLER_PATH })
          $localReleases = @($localAssets | Where-Object { $_.Path -eq $env:RELEASES_PATH })
          $localFeedSignature = @($localAssets | Where-Object { $_.Path -eq $env:FEED_SIGNATURE_PATH })
          $localFullPackage = @($localAssets | Where-Object { $_.Path -eq $env:FULL_PACKAGE_PATH })
          $localDeltaPackage = @($localAssets | Where-Object { $_.Path -eq $env:DELTA_PACKAGE_PATH })
          if ($localInstaller.Count -ne 1 `
              -or $localInstaller[0].Sha256 -ne $env:INSTALLER_SHA256.ToLowerInvariant() `
              -or $localReleases.Count -ne 1 `
              -or $localFeedSignature.Count -ne 1 `
              -or $localFeedSignature[0].Sha256 -ne $env:FEED_SIGNATURE_SHA256 `
              -or $localFeedSignature[0].Size -ne [int64]$env:FEED_SIGNATURE_SIZE `
              -or $localFullPackage.Count -ne 1 `
              -or $localFullPackage[0].Sha256 -ne $env:FULL_PACKAGE_SHA256.ToLowerInvariant() `
              -or ($localDeltaPackage.Count -eq 1 `
                -and $localDeltaPackage[0].Sha256 -ne $env:DELTA_PACKAGE_SHA256.ToLowerInvariant())) {
            throw "Packaging outputs do not match the tested local release-asset bytes."
          }

          function Convert-ReleaseApiRecord([object]$ReleaseApi) {
            if ($null -eq $ReleaseApi -or $null -eq $ReleaseApi.id) {
              throw "Release API metadata is missing its numeric identifier."
            }
            return [pscustomobject]@{
              body = [string]$ReleaseApi.body
              databaseId = [int64]$ReleaseApi.id
              isDraft = [bool]$ReleaseApi.draft
              isImmutable = [bool]$ReleaseApi.immutable
              isPrerelease = [bool]$ReleaseApi.prerelease
              tagName = [string]$ReleaseApi.tag_name
              targetCommitish = [string]$ReleaseApi.target_commitish
              assets = @($ReleaseApi.assets)
            }
          }

          function Get-DraftReleaseByTag([switch]$AllowAbsent) {
            # GitHub keeps a mutable draft reachable to its author through the
            # authenticated release inventory. The public tag endpoint remains
            # unavailable until the draft is published, so never use it here.
            # Draft metadata can take a few seconds to appear in the
            # authenticated inventory after gh release create returns. Poll a
            # bounded window and only accept the exact mutable record we just
            # staged; no public tag endpoint is consulted before publication.
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(90)
            $attempt = 0
            $lastObservation = 'no authenticated inventory query completed'
            do {
              $attempt += 1
              $inventoryJson = gh api --paginate --slurp `
                -H "Accept: application/vnd.github+json" `
                -H "X-GitHub-Api-Version: 2026-03-10" `
                "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not enumerate draft releases for $env:RELEASE_TAG."
              }
              $inventory = @(
                (($inventoryJson -join [Environment]::NewLine) | ConvertFrom-Json) |
                  ForEach-Object { $_ }
              )
              $tagMatches = @($inventory | Where-Object {
                ([string]$_.tag_name -eq $env:RELEASE_TAG) `
                  -or (
                $_.draft `
                  -and -not $_.immutable `
                  -and -not $_.prerelease `
                  -and [string]$_.target_commitish -eq $env:GITHUB_SHA `
                  -and [string]$_.tag_name.StartsWith('untagged-', [StringComparison]::Ordinal)
                  )
              })
              $exactDraftMatches = @($tagMatches | Where-Object {
                $_.draft -and -not $_.immutable -and -not $_.prerelease `
                  -and [string]$_.target_commitish -eq $env:GITHUB_SHA
              })
              if ($tagMatches.Count -eq 1 -and $exactDraftMatches.Count -eq 1) {
                return Convert-ReleaseApiRecord $exactDraftMatches[0]
              }

              $lastObservation = "$($tagMatches.Count) tag record(s), $($exactDraftMatches.Count) exact mutable draft record(s)"
              if ($AllowAbsent -and $tagMatches.Count -eq 0) {
                return $null
              }
              if ($tagMatches.Count -ne 0) {
                throw "Expected exactly one authenticated mutable draft-release record for $env:RELEASE_TAG at $env:GITHUB_SHA; observed $lastObservation."
              }
              if ([DateTimeOffset]::UtcNow -ge $deadline) {
                break
              }

              Start-Sleep -Seconds ([Math]::Min(8, $attempt * 2))
            } while ($true)

            throw "Expected exactly one authenticated mutable draft-release record for $env:RELEASE_TAG at $env:GITHUB_SHA; last observed $lastObservation after $attempt poll(s)."
          }

          function Assert-ReleaseAssetsAndSignedFeed(
            [string]$Phase,
            [object]$ReleaseApi
          ) {
            if ($null -eq $ReleaseApi) {
              throw "Could not read $Phase asset integrity metadata for $env:RELEASE_TAG."
            }
            $publishedAssets = @($ReleaseApi.assets)
            $verifiedDigestCount = 0
            foreach ($localAsset in $localAssets) {
              $publishedMatch = @(
                $publishedAssets | Where-Object { $_.name -eq $localAsset.Name }
              )
              if ($publishedMatch.Count -ne 1) {
                throw "$Phase does not contain exactly one $($localAsset.Name) asset."
              }
              $publishedAsset = $publishedMatch[0]
              if ([int64]$publishedAsset.size -ne $localAsset.Size `
                  -or [string]$publishedAsset.state -ne 'uploaded') {
                throw "$Phase asset size/state differs from tested local asset $($localAsset.Name)."
              }
              $publishedDigest = [string]$publishedAsset.digest
              if (-not [string]::IsNullOrWhiteSpace($publishedDigest)) {
                if ($publishedDigest -notmatch '^sha256:(?<sha>[0-9a-fA-F]{64})$' `
                    -or $Matches.sha.ToLowerInvariant() -ne $localAsset.Sha256) {
                  throw "$Phase SHA-256 digest differs from tested local asset $($localAsset.Name)."
                }
                $verifiedDigestCount++
              }
            }
            Write-Host "Verified size/state for $($localAssets.Count) $Phase assets and API SHA-256 evidence for $verifiedDigestCount."

            $verificationRoot = Join-Path $env:RUNNER_TEMP `
              "qbt-material-$($Phase.Replace(' ', '-'))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if (Test-Path -LiteralPath $verificationRoot) {
              throw "$Phase verification directory unexpectedly exists: $verificationRoot"
            }
            New-Item -ItemType Directory -Path $verificationRoot | Out-Null
            $publishedSetupPath = Join-Path $verificationRoot $localInstaller[0].Name
            $publishedReleasesPath = Join-Path $verificationRoot $localReleases[0].Name
            $publishedSignaturePath = Join-Path $verificationRoot $localFeedSignature[0].Name
            gh release download $ReleaseApi.tagName `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $localInstaller[0].Name `
              --pattern $localReleases[0].Name `
              --pattern $localFeedSignature[0].Name `
              --dir $verificationRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Could not redownload the $Phase Squirrel Setup for byte verification."
            }
            if (-not (Test-Path -LiteralPath $publishedSetupPath -PathType Leaf)) {
              throw "Redownloaded Squirrel Setup is missing: $publishedSetupPath"
            }
            $publishedSetupItem = Get-Item -LiteralPath $publishedSetupPath
            $publishedSetupSha256 = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath $publishedSetupPath).Hash.ToLowerInvariant()
            if ([int64]$publishedSetupItem.Length -ne $localInstaller[0].Size `
                -or $publishedSetupSha256 -ne $localInstaller[0].Sha256) {
              throw "Redownloaded Squirrel Setup differs from the exact locally tested bytes."
            }

            foreach ($downloadedFeedPath in @($publishedReleasesPath, $publishedSignaturePath)) {
              if (-not (Test-Path -LiteralPath $downloadedFeedPath -PathType Leaf)) {
                throw "Redownloaded signed-feed asset is missing: $downloadedFeedPath"
              }
            }
            $publishedReleasesBytes = [IO.File]::ReadAllBytes($publishedReleasesPath)
            $publishedSignatureBytes = [IO.File]::ReadAllBytes($publishedSignaturePath)
            $publishedReleasesSha256 = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($publishedReleasesBytes)).ToLowerInvariant()
            $publishedSignatureSha256 = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($publishedSignatureBytes)).ToLowerInvariant()
            if ($publishedReleasesBytes.Length -ne $localReleases[0].Size `
                -or $publishedReleasesSha256 -ne $localReleases[0].Sha256 `
                -or $publishedSignatureBytes.Length -ne $localFeedSignature[0].Size `
                -or $publishedSignatureBytes.Length -gt 1024 `
                -or $publishedSignatureSha256 -ne $localFeedSignature[0].Sha256) {
              throw "Redownloaded RELEASES/signature bytes differ from the exact locally verified feed."
            }
            $publishedKeyRecord = Get-Content -Raw -LiteralPath `
              (Join-Path $env:GITHUB_WORKSPACE 'resources/updates/squirrel-feed-public-key.json') |
              ConvertFrom-Json
            $publishedPublicDer = [Convert]::FromBase64String(
              [string]$publishedKeyRecord.spkiDerBase64)
            $publishedPublicRsa = [Security.Cryptography.RSA]::Create()
            try {
              $publishedPublicBytesRead = 0
              $publishedPublicRsa.ImportSubjectPublicKeyInfo(
                $publishedPublicDer, [ref]$publishedPublicBytesRead)
              if ($publishedPublicBytesRead -ne $publishedPublicDer.Length `
                  -or -not $publishedPublicRsa.VerifyData(
                    $publishedReleasesBytes,
                    $publishedSignatureBytes,
                    [Security.Cryptography.HashAlgorithmName]::SHA256,
                    [Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
                throw "Redownloaded RELEASES.sig failed committed-public-key verification."
              }
            }
            finally {
              $publishedPublicRsa.Dispose()
            }
            Write-Host "Verified redownloaded Setup and exact signed RELEASES assets against local SHA-256, size, and RSA evidence for $Phase."
          }

          $tagRefs = @(& git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -ne 0) {
            throw "Could not re-prove release-tag availability (git exit $tagLookupExitCode)."
          }
          if ($tagRefs.Count -ne 0) {
            throw "Refusing to overwrite immutable release tag $env:RELEASE_TAG."
          }

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -ne 0) {
            throw "Could not list releases (gh exit $releaseLookupExitCode)."
          }
          $releaseMatches = @(($releaseJson | ConvertFrom-Json) | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          })
          if ($releaseMatches.Count -ne 0) {
            throw "Refusing to mutate existing release $env:RELEASE_TAG."
          }

          $runJson = gh run view $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --json jobs
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read first-job timing for workflow run $env:GITHUB_RUN_ID."
          }
          $jobStarts = @(
            ($runJson | ConvertFrom-Json).jobs |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_.startedAt) } |
              ForEach-Object {
                [DateTimeOffset]::Parse(
                  $_.startedAt,
                  [Globalization.CultureInfo]::InvariantCulture,
                  [Globalization.DateTimeStyles]::AssumeUniversal
                ).ToUniversalTime()
              }
          )
          if ($jobStarts.Count -eq 0) {
            throw "Workflow run $env:GITHUB_RUN_ID did not report a first-job startedAt value."
          }
          $workflowStarted = @($jobStarts | Sort-Object)[0]
          $workflowStarted = [DateTimeOffset]::FromUnixTimeSeconds(
            $workflowStarted.ToUnixTimeSeconds())
          $workflowStartedText = $workflowStarted.ToString(
            "yyyy-MM-dd'T'HH:mm:ss'Z'", [Globalization.CultureInfo]::InvariantCulture)

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          if ($env:DIM_SUM_AVAILABLE -notin @('true', 'false')) {
            throw "Dim-sum release availability evidence is invalid."
          }
          if ($env:DIM_SUM_AVAILABLE -eq 'true') {
            $escapedPhotoTag = [regex]::Escape($env:DIM_SUM_PHOTO_TAG)
            $escapedPhotoAssetName = [regex]::Escape($env:DIM_SUM_PHOTO_ASSET_NAME)
            if ([string]::IsNullOrWhiteSpace($env:DIM_SUM_ID) `
                -or $env:DIM_SUM_CODE_NAME -cne "$env:DIM_SUM_ENGLISH · $env:DIM_SUM_ZH_HANT" `
                -or $env:DIM_SUM_PHOTO_ASSET_NAME -notmatch '^hk-dish-[0-9]{4}-[a-z0-9-]+\.png$' `
                -or $env:DIM_SUM_PHOTO_TAG -notmatch '^catalog-v1(?:-part-[0-9]{3})?$' `
                -or $env:DIM_SUM_PHOTO_URL -notmatch "^https://github\.com/Ding-Ding-Projects/dim-sum-photos/releases/download/$escapedPhotoTag/$escapedPhotoAssetName$" `
                -or $env:DIM_SUM_PHOTO_DIGEST -notmatch '^sha256:[0-9a-f]{64}$' `
                -or $env:DIM_SUM_CATALOG_REVISION -notmatch '^[0-9a-f]{40}$' `
                -or $env:DIM_SUM_CATALOG_BLOB_SHA -notmatch '^[0-9a-f]{40}$') {
              throw "Available dim-sum release identity is incomplete or not from a published public catalog-v1 asset."
            }
            $codeName = "[$env:DIM_SUM_CODE_NAME]($env:DIM_SUM_PHOTO_URL)"
            $photoEvidence = "[$env:DIM_SUM_PHOTO_ASSET_NAME]($env:DIM_SUM_PHOTO_URL) (``$env:DIM_SUM_PHOTO_DIGEST``, release ``$env:DIM_SUM_PHOTO_TAG``)"
            $catalogEvidence = "[$env:DIM_SUM_CATALOG_REVISION]($env:DIM_SUM_CATALOG_SOURCE_URL) (catalog blob ``$env:DIM_SUM_CATALOG_BLOB_SHA``)"
            $codeNameMarker = "<!-- dim-sum-id: $env:DIM_SUM_ID -->"
          }
          else {
            $unavailableReason = if ([string]::IsNullOrWhiteSpace($env:DIM_SUM_REASON)) {
              'No unused dish with a published public photo could be resolved.'
            }
            else { $env:DIM_SUM_REASON }
            $codeName = "Not assigned — $unavailableReason"
            $photoEvidence = "Not attached; this version-only release carries no copied consumer-repository photo."
            $catalogEvidence = "Public catalog unavailable for identity allocation."
            $codeNameMarker = ""
          }
          $lineCount = Get-Content -Raw -LiteralPath $env:LINE_COUNT_PATH
          $deltaHashState = if ($env:PREVIOUS_FEED_AVAILABLE -eq 'true') {
            $env:DELTA_PACKAGE_SHA256
          }
          else {
            'Not applicable to the first Squirrel feed build.'
          }
          $releaseChannel = if ($env:GITHUB_REF_NAME -eq 'master') {
            'master-updater'
          }
          else {
            'feature-preview'
          }

          $releaseNotesTemplate = @"
          Automated Windows desktop release for commit ``$env:GITHUB_SHA``.

          - Build: ``$env:QBT_BUILD_ID``
          - Squirrel package: ``$env:PACKAGE_VERSION``
          - Branch: ``$env:GITHUB_REF_NAME``
          - Release channel: ``$releaseChannel``
          - Installer SHA256: ``$env:INSTALLER_SHA256``
          - Full update package SHA256: ``$env:FULL_PACKAGE_SHA256``
          - Delta update package SHA256: ``$deltaHashState``
          - Authenticode signature: $authenticodeState
          - Feed signature: ``$env:FEED_SIGNATURE_ALGORITHM`` over the exact ``RELEASES`` bytes
          - Feed public-key SPKI SHA256: ``$env:FEED_PUBLIC_KEY_FINGERPRINT``
          - ``RELEASES.sig`` SHA256: ``$env:FEED_SIGNATURE_SHA256``
          - Dim-sum code name: $codeName
          - Public dim-sum photo: $photoEvidence
          - Dim-sum catalog evidence: $catalogEvidence
          $codeNameMarker

          ## Workflow timing

          - Workflow started: ``@@WORKFLOW_STARTED@@``
          - Workflow completed: ``@@WORKFLOW_COMPLETED@@``
          - Workflow duration: ``@@WORKFLOW_DURATION@@``

          ## Project line count

          Reproduce locally with ``scripts/count-lines.ps1`` at commit ``$env:GITHUB_SHA``.

          $lineCount

          The desktop policy checks, release build, normal and silent Squirrel
          installation, generated shortcut launches, stable-stub ``.torrent``
          and ``magnet:`` ownership, exact restoration of seeded per-user
          association values, offscreen launch, workspace recovery, Git
          integrity, and Update.exe uninstall all completed before this release
          was published. When a prior Squirrel feed was available, its manifest
          and the generated current delta package were validated without
          executing a historical installer.
          "@
          $pendingNotes = $releaseNotesTemplate.Replace(
            "@@WORKFLOW_STARTED@@", $workflowStartedText)
          $pendingNotes = $pendingNotes.Replace(
            "@@WORKFLOW_COMPLETED@@", "Pending exact publication completion evidence")
          $pendingNotes = $pendingNotes.Replace(
            "@@WORKFLOW_DURATION@@", "Pending exact publication completion evidence")
          $pendingNotes | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM

          $currentPackageVersion = [version]::Parse($env:PACKAGE_VERSION)
          $masterReleasesBeforePublish = @(Get-PublishedMasterSquirrelReleases)
          $highestMasterBeforePublish = @(
            $masterReleasesBeforePublish |
              Sort-Object PackageVersion -Descending |
              Select-Object -First 1
          )
          $isNewestMasterPackage = $env:GITHUB_REF_NAME -eq 'master' `
            -and ($highestMasterBeforePublish.Count -eq 0 `
              -or $currentPackageVersion -gt $highestMasterBeforePublish[0].PackageVersion)
          if ($highestMasterBeforePublish.Count -eq 0) {
            Write-Host "No earlier master-channel Squirrel release participates in latest arbitration."
          }
          else {
            Write-Host "Highest master-channel package before publication: $($highestMasterBeforePublish[0].PackageVersionText) ($($highestMasterBeforePublish[0].TagName))."
          }
          $stagedRelease = Get-DraftReleaseByTag -AllowAbsent
          if ($null -eq $stagedRelease) {
            Write-Host "Staging $env:PACKAGE_VERSION on $releaseChannel; latest-channel selection is deferred until publication."
            gh release create $env:RELEASE_TAG `
              $releaseAssets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes-file $notesPath `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub did not create draft release $env:RELEASE_TAG."
            }

            $stagedRelease = Get-DraftReleaseByTag
          }
          else {
            Write-Host "Reusing exact mutable draft $env:RELEASE_TAG after a same-run retry; all staged bytes and metadata will be revalidated before publication."
          }
          if ([string]$stagedRelease.tagName -ne $env:RELEASE_TAG) {
            # A fresh draft carries a temporary untagged-* placeholder until
            # the tag exists. Rename it to the intended immutable tag before
            # any downstream verification or publication step reads tagName.
            gh api --method PATCH `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2026-03-10" `
              "repos/$env:GITHUB_REPOSITORY/releases/$($stagedRelease.databaseId)" `
              -f tag_name=$env:RELEASE_TAG | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Could not set tag_name on staged draft release."
            }
            # The release-by-ID endpoint reflects a PATCH immediately,
            # unlike the paginated inventory which may lag briefly.
            $renamedJson = gh api `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2026-03-10" `
              "repos/$env:GITHUB_REPOSITORY/releases/$($stagedRelease.databaseId)"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not re-read staged draft after tag_name rename."
            }
            $stagedRelease = Convert-ReleaseApiRecord ($renamedJson | ConvertFrom-Json)
          }
          if (-not $stagedRelease.isDraft `
              -or $stagedRelease.isImmutable `
              -or $stagedRelease.isPrerelease `
              -or $stagedRelease.tagName -ne $env:RELEASE_TAG `
              -or $stagedRelease.targetCommitish -ne $env:GITHUB_SHA) {
            throw "Staged release failed draft status, mutability, tag, or target verification."
          }
          Assert-ReleaseAssetsAndSignedFeed "staged draft" $stagedRelease

          # An immutable public release cannot be safely repaired. Record the
          # final timing in the still-mutable draft immediately after all asset
          # validation, validate that exact final body, then perform the single
          # draft-to-public transition below.
          $workflowCompleted = [DateTimeOffset]::FromUnixTimeSeconds(
            [DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          if ($workflowCompleted -lt $workflowStarted) {
            throw "Workflow completion preceded its first-job start; timing evidence is invalid."
          }
          $workflowCompletedText = $workflowCompleted.ToString(
            "yyyy-MM-dd'T'HH:mm:ss'Z'", [Globalization.CultureInfo]::InvariantCulture)
          $workflowElapsed = $workflowCompleted - $workflowStarted
          $workflowDuration = "{0:D2}:{1:D2}:{2:D2}" -f `
            [int][Math]::Floor($workflowElapsed.TotalHours), `
            [int]$workflowElapsed.Minutes, `
            [int]$workflowElapsed.Seconds
          $finalNotes = $releaseNotesTemplate.Replace(
            "@@WORKFLOW_STARTED@@", $workflowStartedText)
          $finalNotes = $finalNotes.Replace(
            "@@WORKFLOW_COMPLETED@@", $workflowCompletedText)
          $finalNotes = $finalNotes.Replace(
            "@@WORKFLOW_DURATION@@", $workflowDuration)
          $finalNotes | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM

          $notesPayloadPath = Join-Path $env:RUNNER_TEMP `
            "release-notes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (Test-Path -LiteralPath $notesPayloadPath) {
            throw "Release-notes payload unexpectedly exists: $notesPayloadPath"
          }
          [pscustomobject]@{ body = $finalNotes } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath $notesPayloadPath -Encoding utf8NoBOM
          gh api --method PATCH `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            --input $notesPayloadPath `
            "repos/$env:GITHUB_REPOSITORY/releases/$($stagedRelease.databaseId)" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not write final timing evidence into staged release $env:RELEASE_TAG."
          }

          # The release-by-ID endpoint reflects a PATCH immediately,
          # unlike the paginated inventory which may lag briefly.
          $finalJson = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/releases/$($stagedRelease.databaseId)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not re-read staged draft after timing-evidence PATCH."
          }
          $stagedRelease = Convert-ReleaseApiRecord ($finalJson | ConvertFrom-Json)

          $requiredAssetNames = @($releaseAssets | ForEach-Object { Split-Path -Leaf $_ })
          $stagedAssetNames = @($stagedRelease.assets | ForEach-Object { $_.name })
          $missingStagedAssetNames = @(
            $requiredAssetNames | Where-Object { $stagedAssetNames -notcontains $_ }
          )
          $timingLines = @(
            "- Workflow started: ``$workflowStartedText``",
            "- Workflow completed: ``$workflowCompletedText``",
            "- Workflow duration: ``$workflowDuration``"
          )
          $missingStagedTimingLines = @(
            $timingLines | Where-Object { -not $stagedRelease.body.Contains($_) }
          )
          $releaseEvidenceLines = @(
            "- Squirrel package: ``$env:PACKAGE_VERSION``",
            "- Branch: ``$env:GITHUB_REF_NAME``",
            "- Release channel: ``$releaseChannel``",
            "- Authenticode signature: $authenticodeState",
            "- Feed signature: ``$env:FEED_SIGNATURE_ALGORITHM`` over the exact ``RELEASES`` bytes",
            "- Feed public-key SPKI SHA256: ``$env:FEED_PUBLIC_KEY_FINGERPRINT``",
            "- ``RELEASES.sig`` SHA256: ``$env:FEED_SIGNATURE_SHA256``",
            "- Dim-sum code name: $codeName",
            "- Public dim-sum photo: $photoEvidence",
            "- Dim-sum catalog evidence: $catalogEvidence"
          )
          $missingStagedEvidence = @(
            $releaseEvidenceLines | Where-Object { -not $stagedRelease.body.Contains($_) }
          )
          if (-not $stagedRelease.isDraft `
              -or $stagedRelease.isImmutable `
              -or $stagedRelease.isPrerelease `
              -or $stagedRelease.tagName -ne $env:RELEASE_TAG `
              -or $stagedRelease.targetCommitish -ne $env:GITHUB_SHA `
              -or $missingStagedAssetNames.Count -ne 0 `
              -or $missingStagedTimingLines.Count -ne 0 `
              -or $missingStagedEvidence.Count -ne 0) {
            throw "Staged release failed asset, note, timing, signature, channel, or target verification."
          }
          Write-Host "Validated staged draft $env:RELEASE_TAG; publishing its verified assets and notes exactly once."

          if ($null -eq $stagedRelease.databaseId -or [int64]$stagedRelease.databaseId -le 0) {
            throw "Staged release is missing its numeric GitHub release identifier."
          }
          $makeLatest = if ($isNewestMasterPackage) { 'true' } else { 'false' }
          gh api --method PATCH `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/releases/$($stagedRelease.databaseId)" `
            -f draft=false `
            --raw-field "make_latest=$makeLatest" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub did not publish verified draft release $env:RELEASE_TAG."
          }

          $publishedReleaseJson = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read published release metadata for $env:RELEASE_TAG."
          }
          $publishedRelease = Convert-ReleaseApiRecord (
            $publishedReleaseJson | ConvertFrom-Json)
          if ($publishedRelease.isDraft `
              -or -not $publishedRelease.isImmutable `
              -or $publishedRelease.isPrerelease `
              -or $publishedRelease.tagName -ne $env:RELEASE_TAG `
              -or $publishedRelease.targetCommitish -ne $env:GITHUB_SHA) {
            throw "Published release failed status, immutability, tag, or target verification."
          }
          Assert-ReleaseAssetsAndSignedFeed "published immutable release" $publishedRelease
          Write-Host "Verified published immutable release $env:RELEASE_TAG against the triggering commit and exact Squirrel bytes."
