name: Build and release every push

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# One run creates one immutable, full release for the commit that triggered it.
# Branch filtering excludes tag pushes, so the release tag cannot start a loop.
permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static-md

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Measure hosted runner resources
        shell: pwsh
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $logicalProcessors = [int] $computer.NumberOfLogicalProcessors
          $memoryGiB = [Math]::Round($computer.TotalPhysicalMemory / 1GB, 2)
          $freeMemoryGiB = [Math]::Round($operatingSystem.FreePhysicalMemory * 1KB / 1GB, 2)

          Write-Host "Runner image: $env:ImageOS"
          Write-Host "Logical processors: $logicalProcessors"
          Write-Host "Physical memory: $memoryGiB GiB ($freeMemoryGiB GiB free)"

          if ($logicalProcessors -lt 2 -or $freeMemoryGiB -lt 2) {
            throw "The hosted runner is below the measured CPU or memory minimum."
          }

          $buildRoots = @(
            [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE),
            [IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique
          $reportedRoots = @($env:SystemDrive) + $buildRoots | Sort-Object -Unique
          foreach ($root in $reportedRoots) {
            $deviceId = $root.TrimEnd('\')
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$deviceId'"
            if ($null -eq $disk) {
              throw "Could not measure runner volume $root."
            }
            $diskGiB = [Math]::Round($disk.Size / 1GB, 2)
            $freeDiskGiB = [Math]::Round($disk.FreeSpace / 1GB, 2)
            Write-Host "Volume ${root}: $diskGiB GiB ($freeDiskGiB GiB free)"
            if ($buildRoots -contains $root -and $freeDiskGiB -lt 12) {
              throw "Build volume $root has less than 12 GiB free."
            }
          }

      - name: Prepare an immutable monotonic release identity
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $tag = "build-$env:GITHUB_RUN_NUMBER-$shortSha"
          $title = "qBittorrent Material build #$env:GITHUB_RUN_NUMBER ($shortSha)"
          $buildId = "build.$env:GITHUB_RUN_NUMBER.$shortSha"

          $tagRefs = @(& git ls-remote --tags origin "refs/tags/$tag")
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -ne 0) {
            throw "Could not prove release-tag availability (git exit $tagLookupExitCode)."
          }
          if ($tagRefs.Count -ne 0) {
            throw "Immutable release tag already exists: $tag"
          }

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -ne 0) {
            throw "Could not list releases (gh exit $releaseLookupExitCode)."
          }
          $releaseMatches = @(($releaseJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag })
          if ($releaseMatches.Count -ne 0) {
            throw "Immutable release already exists: $tag"
          }

          $immutablePolicyJson = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/immutable-releases"
          $immutablePolicyExitCode = $LASTEXITCODE
          if ($immutablePolicyExitCode -ne 0) {
            throw "Could not verify repository release immutability (gh exit $immutablePolicyExitCode)."
          }
          $immutablePolicy = $immutablePolicyJson | ConvertFrom-Json
          if (-not $immutablePolicy.enabled) {
            throw "Repository release immutability must be enabled before building."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "QBT_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          Write-Host "Reserved release identity $tag for $env:GITHUB_SHA."

      - name: Run desktop policy and content-integrity tests
        shell: pwsh
        run: ./scripts/test-desktop-policy.ps1

      - name: Activate the MSVC 2022 toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # The install-qt wrapper action delegates through mutable @v6/@v4 tags.
      # Invoke its internal action directly after pinning Python ourselves so
      # every downloaded action in this write-capable release job is immutable.
      - name: Set up Python for the Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qt5compat qtimageformats qtshadertools qtmultimedia"
          cache: true

      - name: Set up vcpkg and binary caching
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: "**/vcpkg.json"
          runVcpkgInstall: false

      - name: Configure the release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DQBT_BUILD_ID=$env:QBT_BUILD_ID"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Build and verify the NSIS installer
        id: package
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G NSIS -C Release
          $cpackExitCode = $LASTEXITCODE

          $nsisLog = "build/packages/_CPack_Packages/win64/NSIS/NSISOutput.log"
          if (Test-Path -LiteralPath $nsisLog) {
            Write-Host "----- NSISOutput.log -----"
            Get-Content -LiteralPath $nsisLog
            Write-Host "----- end NSISOutput.log -----"
          }
          if ($cpackExitCode -ne 0) {
            throw "cpack exited with code $cpackExitCode."
          }

          $installers = @(
            Get-ChildItem -Path "build/packages" -File `
              -Filter "qBittorrent-Material-*-$env:QBT_BUILD_ID-windows-x64.exe"
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()

          $smokeRoot = Join-Path $env:RUNNER_TEMP "qbt-material-smoke"
          if (Test-Path -LiteralPath $smokeRoot) {
            Remove-Item -Recurse -Force -LiteralPath $smokeRoot
          }
          $installProcess = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$smokeRoot") `
            -PassThru -Wait
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installer returned exit code $($installProcess.ExitCode)."
          }

          $installedExe = Join-Path $smokeRoot "bin/qbittorrent.exe"
          # Qt's CMake deployment API keeps plugins at the install prefix,
          # beside bin/, rather than nesting them under the executable folder.
          $platformPluginRoot = Join-Path $smokeRoot "plugins/platforms"
          $windowsPlatformPlugin = Join-Path $platformPluginRoot "qwindows.dll"
          $offscreenPlatformPlugin = Join-Path $platformPluginRoot "qoffscreen.dll"
          $debugPlatformPlugins = @(
            Join-Path $platformPluginRoot "qwindowsd.dll"
            Join-Path $platformPluginRoot "qoffscreend.dll"
          )
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Installed executable is missing: $installedExe"
          }
          foreach ($platformPlugin in @($windowsPlatformPlugin, $offscreenPlatformPlugin)) {
            if (-not (Test-Path -LiteralPath $platformPlugin)) {
              throw "Qt platform plugin is missing: $platformPlugin"
            }
          }
          foreach ($debugPlatformPlugin in $debugPlatformPlugins) {
            if (Test-Path -LiteralPath $debugPlatformPlugin) {
              throw "Debug Qt platform plugin leaked into Release package: $debugPlatformPlugin"
            }
          }

          $gitExecutable = (Get-Command git.exe -CommandType Application -ErrorAction Stop `
            | Select-Object -First 1).Source
          $originalPath = $env:PATH
          $env:PATH = (@($originalPath -split ";" | Where-Object {
            $segment = $_.Trim()
            if ([string]::IsNullOrWhiteSpace($segment)) { return $false }
            -not (Test-Path -LiteralPath (Join-Path $segment "git.exe")) `
              -and -not (Test-Path -LiteralPath (Join-Path $segment "git.cmd"))
          }) -join ";")
          $gitOnPath = @($env:PATH -split ";" | Where-Object {
            $segment = $_.Trim()
            $segment -and ((Test-Path -LiteralPath (Join-Path $segment "git.exe")) `
              -or (Test-Path -LiteralPath (Join-Path $segment "git.cmd")))
          })
          if ($gitOnPath.Count -ne 0) {
            throw "Git must be absent from PATH during the installed-app smoke test."
          }

          $workspaceRoot = Join-Path $env:RUNNER_TEMP "qbt-material-workspace-smoke"
          if (Test-Path -LiteralPath $workspaceRoot) {
            Remove-Item -Recurse -Force -LiteralPath $workspaceRoot
          }
          $env:QBT_WORKSPACE_ROOT = $workspaceRoot
          $env:QT_QPA_PLATFORM = "offscreen"

          $smokeLogRoot = Join-Path $env:RUNNER_TEMP "qbt-material-smoke-logs"
          New-Item -ItemType Directory -Force -Path $smokeLogRoot | Out-Null
          function Write-SmokeOutput($launch) {
            foreach ($stream in @(
              @{ Name = "stdout"; Path = $launch.Stdout },
              @{ Name = "stderr"; Path = $launch.Stderr }
            )) {
              Write-Host "::group::$($launch.Label) $($stream.Name)"
              if (Test-Path -LiteralPath $stream.Path) {
                $content = Get-Content -Raw -LiteralPath $stream.Path
                if ([string]::IsNullOrEmpty($content)) { Write-Host "<empty>" }
                else { Write-Host $content }
              }
              else { Write-Host "<missing>" }
              Write-Host "::endgroup::"
            }
          }
          function Start-SmokeApplication([string] $label) {
            $safeLabel = $label -replace '[^A-Za-z0-9_-]', '-'
            $stdout = Join-Path $smokeLogRoot "$safeLabel.stdout.log"
            $stderr = Join-Path $smokeLogRoot "$safeLabel.stderr.log"
            Remove-Item -Force -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $installedExe -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 10
            $launch = [pscustomobject]@{
              Label = $label
              Process = $process
              Stdout = $stdout
              Stderr = $stderr
            }
            if ($process.HasExited) {
              Write-SmokeOutput $launch
              throw "$label exited during smoke test with code $($process.ExitCode)."
            }
            return $launch
          }
          function Stop-SmokeApplication($launch) {
            Stop-Process -Id $launch.Process.Id -Force
            $launch.Process.WaitForExit()
            Write-SmokeOutput $launch
          }

          $initialLaunch = Start-SmokeApplication "Installed application"
          Stop-SmokeApplication $initialLaunch

          $workspaceJson = Join-Path $workspaceRoot "workspace.json"
          $workspaceGit = Join-Path $workspaceRoot ".git"
          $workspaceTabs = @(Get-ChildItem -LiteralPath (Join-Path $workspaceRoot "tabs") `
            -Filter "*.md" -File -ErrorAction SilentlyContinue)
          if (-not (Test-Path -LiteralPath $workspaceJson)) {
            throw "Installed application did not persist workspace.json."
          }
          if (-not (Test-Path -LiteralPath $workspaceGit)) {
            throw "Installed application did not initialize its embedded local Git repository."
          }
          if ($workspaceTabs.Count -ne 1) {
            throw "Expected one persisted welcome tab, found $($workspaceTabs.Count)."
          }

          $workspaceState = Get-Content -Raw -LiteralPath $workspaceJson | ConvertFrom-Json
          if ($workspaceState.type -ne "qbt-material-workspace" `
              -or $workspaceState.schemaVersion -ne 2 `
              -or @($workspaceState.tabs).Count -ne 1) {
            throw "Persisted workspace metadata failed schema validation."
          }

          # Simulate a crash after a new tab body was atomically written but
          # before workspace.json was replaced. The next launch must adopt the
          # orphan as a recovered tab instead of deleting the only copy.
          $orphanId = [guid]::NewGuid().ToString()
          $orphanContent = "Recovered after interrupted metadata save"
          $orphanPath = Join-Path $workspaceRoot "tabs/$orphanId.md"
          [IO.File]::WriteAllText($orphanPath, $orphanContent, [Text.UTF8Encoding]::new($false))

          $recoveryLaunch = Start-SmokeApplication "Crash-recovery application"
          Stop-SmokeApplication $recoveryLaunch

          $recoveredState = Get-Content -Raw -LiteralPath $workspaceJson | ConvertFrom-Json
          $recoveredTabs = @($recoveredState.tabs)
          $recoveredRecord = @($recoveredTabs | Where-Object { $_.id -eq $orphanId })
          if ($recoveredTabs.Count -ne 2 -or $recoveredRecord.Count -ne 1 `
              -or $recoveredRecord[0].name -notlike "Recovered tab *" `
              -or (Get-Content -Raw -LiteralPath $orphanPath) -ne $orphanContent) {
            throw "Interrupted tab body was not recovered without data loss."
          }

          $recoveryHeadFiles = @(& $gitExecutable -C $workspaceRoot ls-tree -r --name-only HEAD)
          if ($recoveryHeadFiles -notcontains "tabs/$orphanId.md") {
            throw "Recovered tab was not committed by embedded libgit2."
          }

          # Simulate the opposite crash window: workspace.json recorded a close,
          # but the previously tracked body still exists. It must be cleaned up
          # without resurrecting the intentionally closed tab.
          $remainingTabs = @($recoveredTabs | Where-Object { $_.id -ne $orphanId })
          $recoveredState.tabs = $remainingTabs
          $recoveredState.activeTabId = $remainingTabs[0].id
          $closedMetadata = $recoveredState | ConvertTo-Json -Depth 20
          [IO.File]::WriteAllText($workspaceJson, $closedMetadata, [Text.UTF8Encoding]::new($false))

          $closeRecoveryLaunch = Start-SmokeApplication "Interrupted-close application"
          Stop-SmokeApplication $closeRecoveryLaunch

          $closedState = Get-Content -Raw -LiteralPath $workspaceJson | ConvertFrom-Json
          if (@($closedState.tabs).Count -ne 1 `
              -or @($closedState.tabs | Where-Object { $_.id -eq $orphanId }).Count -ne 0 `
              -or (Test-Path -LiteralPath $orphanPath)) {
            throw "Interrupted close was resurrected instead of completed."
          }

          $env:PATH = $originalPath
          & $gitExecutable -C $workspaceRoot rev-parse --verify HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded libgit2 did not create the initial workspace commit."
          }
          & $gitExecutable -C $workspaceRoot fsck --strict
          if ($LASTEXITCODE -ne 0) {
            throw "Workspace repository failed git fsck."
          }
          $headFiles = @(& $gitExecutable -C $workspaceRoot ls-tree -r --name-only HEAD)
          if ($headFiles -contains "tabs/$orphanId.md") {
            throw "Closed tab remains in the final embedded Git commit."
          }
          $workspaceStatus = @(& $gitExecutable -C $workspaceRoot status --porcelain)
          if ($workspaceStatus.Count -ne 0) {
            throw "Recovered workspace repository is not clean."
          }

          $uninstaller = Join-Path $smokeRoot "Uninstall.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw "NSIS uninstaller is missing: $uninstaller"
          }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstaller returned exit code $($uninstallProcess.ExitCode)."
          }

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Installer: $($installer.Name)"
          "SHA256: $hash"

      - name: Publish one immutable non-draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.package.outputs.installer }}
          INSTALLER_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          DIM_SUM_PATH: resources/dim-sum/har-gow.png
        run: |
          foreach ($requiredPath in @($env:INSTALLER_PATH, $env:DIM_SUM_PATH)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required release asset is missing: $requiredPath"
            }
          }

          $tagRefs = @(& git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -ne 0) {
            throw "Could not re-prove release-tag availability (git exit $tagLookupExitCode)."
          }
          if ($tagRefs.Count -ne 0) {
            throw "Refusing to overwrite immutable release tag $env:RELEASE_TAG."
          }

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -ne 0) {
            throw "Could not list releases (gh exit $releaseLookupExitCode)."
          }
          $releaseMatches = @(($releaseJson | ConvertFrom-Json) | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          })
          if ($releaseMatches.Count -ne 0) {
            throw "Refusing to mutate existing release $env:RELEASE_TAG."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          Automated Windows desktop release for commit ``$env:GITHUB_SHA``.

          - Build: ``$env:QBT_BUILD_ID``
          - Branch: ``$env:GITHUB_REF_NAME``
          - Installer SHA256: ``$env:INSTALLER_SHA256``
          - Dim-sum photo: Shrimp dumpling · 蝦餃 (``har-gow.png``)

          The desktop policy checks, release build, silent installation, offscreen
          launch, workspace recovery checks, Git integrity check, and silent
          uninstall all completed before this release was published.
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM

          gh release create $env:RELEASE_TAG `
            $env:INSTALLER_PATH `
            $env:DIM_SUM_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file $notesPath `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub did not create release $env:RELEASE_TAG."
          }

          $release = $null
          foreach ($attempt in 1..6) {
            $release = gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish,assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Could not verify release $env:RELEASE_TAG."
            }
            if ($release.isImmutable) { break }
            Write-Host "Waiting for GitHub release immutability attestation ($attempt/6)."
            Start-Sleep -Seconds 5
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $installerName = Split-Path -Leaf $env:INSTALLER_PATH
          if ($release.isDraft -or -not $release.isImmutable -or $release.isPrerelease `
              -or $release.tagName -ne $env:RELEASE_TAG `
              -or $release.targetCommitish -ne $env:GITHUB_SHA `
              -or $assetNames -notcontains $installerName `
              -or $assetNames -notcontains "har-gow.png") {
            throw "Published release failed immutability, status, or asset verification."
          }

          Write-Host "Verified full release $env:RELEASE_TAG with installer and har-gow.png."
